<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <!-- Nutrisipe: a plated meal between fork and knife, macro ring around the plate. -->
  <circle cx="300" cy="310" r="200" fill="#FBD9A8" stroke="#B8501C" stroke-width="10"/>
  <circle cx="300" cy="310" r="140" stroke="#F07B3F" stroke-width="7"/>
  <!-- macro ring segments -->
  <path d="M300 96a214 214 0 0 1 185 107" stroke="#5FA052" stroke-width="12" stroke-linecap="round"/>
  <path d="M506 258a214 214 0 0 1-60 208" stroke="#F07B3F" stroke-width="12" stroke-linecap="round"/>
  <!-- food -->
  <circle cx="250" cy="280" r="62" fill="#5FA052"/>
  <circle cx="350" cy="270" r="48" fill="#E0492F"/>
  <ellipse cx="315" cy="365" rx="82" ry="46" fill="#F07B3F"/>
  <circle cx="232" cy="262" r="14" fill="#8CC47E"/>
  <circle cx="272" cy="300" r="12" fill="#8CC47E"/>
  <circle cx="352" cy="266" r="12" fill="#F4826B"/>
  <!-- fork -->
  <g fill="#B8501C">
    <rect x="36" y="150" width="10" height="110" rx="5"/>
    <rect x="56" y="150" width="10" height="110" rx="5"/>
    <rect x="76" y="150" width="10" height="110" rx="5"/>
    <path d="M36 240h50v30a25 25 0 0 1-50 0z"/>
    <rect x="53" y="280" width="16" height="200" rx="8"/>
  </g>
  <!-- knife -->
  <g fill="#B8501C">
    <path d="M532 150c26 30 34 90 20 150h-20z"/>
    <rect x="530" y="290" width="16" height="190" rx="8"/>
  </g>
</svg>
